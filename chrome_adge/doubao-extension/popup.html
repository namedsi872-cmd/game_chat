<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doubao Exporter</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0f172a;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #38bdf8;
        --border: #243041;
      }
      body {
        margin: 0;
        width: 340px;
        padding: 14px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #0f172a, #111827);
        color: var(--text);
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 10px 0 6px;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #0b1220;
        color: var(--text);
        padding: 10px 12px;
        outline: none;
      }
      input:focus,
      select:focus {
        border-color: var(--accent);
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        flex: 1;
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .primary {
        background: var(--accent);
        color: #082f49;
      }
      .secondary {
        background: #1f2937;
        color: var(--text);
      }
      .status {
        margin-top: 12px;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
        min-height: 36px;
        white-space: pre-wrap;
      }
      .tip {
        margin-top: 10px;
        font-size: 11px;
        color: #94a3b8;
      }
      .filename-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .filename-row input {
        flex: 1;
      }
      .ext-box {
        white-space: nowrap;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #0b1220;
        color: #94a3b8;
        font-size: 12px;
        min-width: 110px;
        text-align: center;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <h1>Doubao Thread Exporter</h1>

    <label for="threadUrl">线程链接</label>
    <input id="threadUrl" type="text" placeholder="https://www.doubao.com/thread/..." />

    <label for="fileName">保存文件名</label>
    <div class="filename-row">
      <input id="fileName" type="text" value="doubao-thread" />
      <div id="fileExt" class="ext-box">.handoff.txt</div>
    </div>

    <label for="outputMode">输出模式</label>
    <select id="outputMode">
      <option value="flow-json">对话流 JSON</option>
      <option value="handoff-prompt">接力 TXT</option>
    </select>

    <div class="row">
      <button id="exportUrl" class="primary">打开并导出</button>
      <button id="exportCurrent" class="secondary">导出当前页</button>
    </div>

    <div class="status" id="status">准备就绪。</div>
    <div id="preview" style="margin-top:10px;max-height:180px;overflow:auto;font-size:11px;line-height:1.45;color:#cbd5e1;white-space:pre-wrap;border:1px solid var(--border);border-radius:10px;padding:10px;background:#0b1220;display:none;"></div>
    <div class="tip">保存时会弹出对话框，你可以手动选到 D 盘。</div>

    <script src="popup.js"></script>
  </body>
</html>
